# iOS 테스트 빌드 — 맥 없이 아이폰에 올린다.
#
# macOS 기기가 없어도 되는 이유는 GitHub 이 빌려주는 macOS 러너가 xcodebuild 를
# 대신 돌려 주기 때문이다. 저장소가 public 이라 이 러너는 무료다.
#
# 서명은 하지 않는다. 무료 Apple ID 서명은 Sideloadly 가 로컬에서 하는 일이라
# CI 에 인증서나 프로비저닝 프로파일을 넣을 이유가 없다 — CODE_SIGNING_ALLOWED=NO
# 로 빌드한 .app 을 Payload/ 에 담아 zip 하면 그게 곧 unsigned .ipa 다.
name: iOS 테스트 빌드 (unsigned IPA)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "익스포트 템플릿"
        type: choice
        options: [debug, release]
        default: debug
  # feat/** 이 같이 들어 있는 것은 main 이 한참 뒤처져 있기 때문이다 — 지금
  # 개발 중인 브랜치를 빌드해야 폰에서 보는 것이 실제 작업물이 된다.
  # 참고: 왼쪽 Actions 목록의 "Run workflow" 수동 버튼은 이 파일이 **기본
  # 브랜치(main)** 에 올라가야 비로소 나타난다. 그전까지 방아쇠는 push 뿐이다.
  push:
    branches: [main, "feat/**"]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: ios-testbuild-${{ github.ref }}
  cancel-in-progress: true

env:
  # 프로젝트를 만든 에디터와 같은 버전이어야 한다. 올릴 때 여기 두 줄만 고친다.
  GODOT_VERSION: "4.5"
  GODOT_RELEASE: "stable"
  EXPORT_PRESET: "iOS"
  APP_NAME: "EsportsManager"
  # 햅틱 네이티브 플러그인의 원본. 바이너리는 이 저장소에 커밋하지 않는다 —
  # `.gdip` 플러그인은 엔진 헤더에 **컴파일 타임으로 묶이므로** GODOT_VERSION 을
  # 올리는 순간 낡은 .a 가 조용히 안 맞게 된다. 매 빌드에서 굽고 캐시한다.
  HAPTICS_REPO: "toniqat/godot-haptics-upstream-fork"
  HAPTICS_REF: "main"
  # 플러그인은 이 헤더 묶음에 맞춰 컴파일된다. GODOT_VERSION 과 반드시 같아야 한다.
  HAPTICS_HEADERS_URL: "https://github.com/kyoz/godot-ios-extracted-headers/releases/download/stable"

jobs:
  ipa:
    name: Godot 익스포트 → xcodebuild → unsigned .ipa
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: 빌드 타입 결정
        id: cfg
        run: |
          set -euo pipefail
          BT="${{ inputs.build_type || 'debug' }}"
          if [ "$BT" = "release" ]; then
            echo "godot_flag=--export-release" >> "$GITHUB_OUTPUT"
            echo "xcode_config=Release"        >> "$GITHUB_OUTPUT"
          else
            echo "godot_flag=--export-debug"   >> "$GITHUB_OUTPUT"
            echo "xcode_config=Debug"          >> "$GITHUB_OUTPUT"
          fi
          echo "build_type=$BT" >> "$GITHUB_OUTPUT"
          echo "빌드 타입: $BT"

      # 에디터(약 110MB)와 iOS 템플릿을 캐시한다. tpz 전체는 1GB 가 넘지만
      # 우리가 쓰는 것은 그 안의 ios.zip 하나뿐이라 그것만 꺼내서 캐시한다.
      - name: Godot 에디터 캐시
        id: cache-editor
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-editor-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-macos

      - name: iOS 익스포트 템플릿 캐시
        id: cache-template
        uses: actions/cache@v4
        with:
          path: ~/Library/Application Support/Godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}
          key: godot-tpl-ios-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Godot 에디터 내려받기
        if: steps.cache-editor.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          URL="https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_macos.universal.zip"
          echo "GET $URL"
          curl -fsSL --retry 3 -o /tmp/godot.zip "$URL"
          mkdir -p ~/godot-bin
          unzip -q /tmp/godot.zip -d ~/godot-bin

      - name: iOS 익스포트 템플릿 내려받기
        if: steps.cache-template.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TAG="${GODOT_VERSION}-${GODOT_RELEASE}"
          URL="https://github.com/godotengine/godot/releases/download/${TAG}/Godot_v${TAG}_export_templates.tpz"
          DIR="$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"
          echo "GET $URL"
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$URL"
          mkdir -p "$DIR"
          # tpz 는 그냥 zip 이다. 필요한 것은 그 안의 ios.zip 하나뿐.
          unzip -j -o /tmp/templates.tpz "templates/ios.zip" -d "$DIR"
          ls -la "$DIR"

      - name: 도구 버전 확인
        run: |
          set -euo pipefail
          "$HOME/godot-bin/Godot.app/Contents/MacOS/Godot" --headless --version
          xcodebuild -version
          echo "--- 설치된 템플릿 ---"
          ls -la "$HOME/Library/Application Support/Godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

      # ── 햅틱 네이티브 플러그인 ────────────────────────────────────────────
      # 이게 없으면 빌드는 초록불인데 `Engine.has_singleton("Haptics")` 만 false 라
      # `autoloads/Haptics.gd` 가 조용히 `Input.vibrate_handheld` 폴백으로 떨어진다.
      # 그래서 아래 "확인" 스텝이 파일 셋을 실제로 검사하고 없으면 빌드를 세운다.
      - name: 햅틱 플러그인 소스 SHA 확인
        id: hap
        run: |
          set -euo pipefail
          SHA="$(git ls-remote "https://github.com/${HAPTICS_REPO}.git" "${HAPTICS_REF}" | cut -f1)"
          if [ -z "$SHA" ]; then
            echo "::error::${HAPTICS_REPO}@${HAPTICS_REF} 를 찾지 못했다."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "플러그인 소스 = ${HAPTICS_REPO}@${SHA}"

      # 캐시 키에 Godot 버전과 소스 SHA 를 **둘 다** 넣는다 — 둘 중 어느 쪽이
      # 움직여도 낡은 .a 를 재사용하면 안 된다.
      - name: 햅틱 플러그인 캐시
        id: cache-haptics
        uses: actions/cache@v4
        with:
          path: ios/plugins/haptics
          key: haptics-ios-${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}-${{ steps.hap.outputs.sha }}-arm64

      - name: 햅틱 플러그인 소스 체크아웃
        if: steps.cache-haptics.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.HAPTICS_REPO }}
          ref: ${{ steps.hap.outputs.sha }}
          path: .haptics-src

      # 러너 기본 python 은 외부 관리(externally-managed) 라 pip 가 거부한다.
      # setup-python 이 주는 격리된 인터프리터에 넣는 쪽이 확실하다.
      - name: Python / scons 준비
        if: steps.cache-haptics.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: scons 설치
        if: steps.cache-haptics.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet scons
          scons --version | head -3

      - name: 햅틱 플러그인 빌드 (arm64)
        if: steps.cache-haptics.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          SRC="$PWD/.haptics-src"
          HDR="extracted_headers_godot_${GODOT_VERSION}.zip"

          echo "GET ${HAPTICS_HEADERS_URL}/${HDR}"
          curl -fsSL --retry 3 -o /tmp/headers.zip "${HAPTICS_HEADERS_URL}/${HDR}"
          unzip -q -o /tmp/headers.zip -d "$SRC/ios/"
          test -d "$SRC/ios/godot/platform/ios" || { echo "::error::헤더 묶음에 platform/ios 가 없다."; exit 1; }

          # 배포 타깃을 12.0 으로 올린다. 원본 SConstruct 는 10.0 을 박아 두는데
          # 그 값은 지금 Xcode 가 받아 주는 범위 밖이다.
          sed -i '' 's/ios-simulator-version-min=10\.0/ios-simulator-version-min=12.0/g; s/iphoneos-version-min=10\.0/iphoneos-version-min=12.0/g' "$SRC/ios/SConstruct"

          # 업스트림의 `generate_static_library.sh` 를 쓰지 않는다 — 그 스크립트는
          # **armv7 과 x86_64 시뮬레이터까지** 굽고 lipo 로 묶는데, armv7 은 Xcode
          # 14 에서 사라졌고 시뮬레이터 슬라이스는 사이드로드하는 실기 빌드에
          # 아무 쓸모가 없다. 우리에게 필요한 것은 arm64 하나다.
          cd "$SRC/ios"
          # SConstruct 의 `target_path` 는 PathVariable 이라 **미리 있어야 한다** —
          # 없으면 SCons 가 만들어 주는 대신 "Path for variable does not exist" 로
          # 죽는다. 업스트림에서는 `build.sh` 가 이 자리를 대신하고 있었다.
          mkdir -p bin
          scons target=release       arch=arm64 plugin=haptics version=4.0
          scons target=release_debug arch=arm64 plugin=haptics version=4.0

          # **파일 이름이 규약이다.** Godot 은 `haptics.a` 가 그 자리에 있으면
          # 그것만 쓰고(release / debug 구분 없음), 없으면 `haptics.release.a` 와
          # `haptics.debug.a` 짝을 찾아 익스포트 타입에 맞는 쪽을 링크한다.
          # 우리는 짝을 놓는다 — 디버그 익스포트에 릴리스 플러그인을 링크하지
          # 않기 위해서다(엔진 심볼에 묶이는 정적 라이브러리다).
          OUT="$GITHUB_WORKSPACE/ios/plugins/haptics"
          mkdir -p "$OUT"
          cp bin/libhaptics.arm64-ios.release.a       "$OUT/haptics.release.a"
          cp bin/libhaptics.arm64-ios.release_debug.a "$OUT/haptics.debug.a"
          cp plugin/haptics.gdip                      "$OUT/haptics.gdip"
          ls -lh "$OUT"

      - name: 햅틱 플러그인 확인 (없으면 여기서 세운다)
        run: |
          set -euo pipefail
          OUT="ios/plugins/haptics"
          MISSING=0
          for f in haptics.gdip haptics.release.a haptics.debug.a; do
            if [ ! -s "$OUT/$f" ]; then echo "없음: $OUT/$f"; MISSING=1; fi
          done
          if [ "$MISSING" = "1" ]; then
            echo "::error::햅틱 플러그인 바이너리가 없다 — 이대로 빌드하면 실기에서 Input.vibrate_handheld 폴백이 돈다."
            exit 1
          fi
          # 실제로 arm64 iOS 아카이브인지, 그리고 Godot 이 부를 심볼이 들어
          # 있는지까지 본다. 빈 껍데기 .a 도 파일 검사만으로는 통과하기 때문이다.
          for f in haptics.release.a haptics.debug.a; do
            lipo -info "$OUT/$f"
            nm -gU "$OUT/$f" 2>/dev/null | grep -q "register_haptics_types" || { echo "::error::$f 에 register_haptics_types 심볼이 없다."; exit 1; }
          done
          grep -q 'plugins/Haptics=true' export_presets.cfg || { echo "::error::export_presets.cfg 에 plugins/Haptics=true 가 없다."; exit 1; }
          echo "플러그인 준비됨 — 폴백 없이 네이티브 햅틱으로 빌드한다."

      # .godot/ 는 저장소에 없다(gitignore). 익스포트 전에 임포트를 한 번 돌려
      # 300여 장의 PNG 와 SVG 를 .godot/imported/ 에 굽는다. 첫 스캔에서 한 번에
      # 안 끝나는 일이 있어 두 번 돌리고, 첫 실패는 무시한다.
      - name: 에셋 임포트
        run: |
          set -uo pipefail
          GODOT="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          "$GODOT" --headless --path . --import || true
          "$GODOT" --headless --path . --import

      - name: Godot iOS 익스포트 (Xcode 프로젝트 생성)
        run: |
          set -euo pipefail
          GODOT="$HOME/godot-bin/Godot.app/Contents/MacOS/Godot"
          mkdir -p build/ios
          # export_presets.cfg 의 application/export_project_only=true 때문에
          # Godot 은 xcodebuild 를 부르지 않고 Xcode 프로젝트만 만들어 둔다 —
          # 서명 플래그를 우리가 쥐기 위해서다.
          "$GODOT" --headless --path . ${{ steps.cfg.outputs.godot_flag }} \
            "$EXPORT_PRESET" "$PWD/build/ios/${APP_NAME}.ipa"
          echo "--- build/ios ---"
          ls -la build/ios

      # 익스포터가 플러그인을 **실제로 집어갔는지** 본다. `plugins/Haptics=true`
      # 는 켜 두고 .gdip 만 안 읽히면 Godot 은 아무 말 없이 그냥 넘어간다 —
      # 그 조합이 정확히 "빌드는 초록불, 폰에서는 폴백" 이다.
      - name: 익스포트 결과에 플러그인이 들어갔는지 확인
        run: |
          set -euo pipefail
          # **익스포터는 고른 쪽을 `haptics.a` 라는 이름으로 베껴 넣는다** —
          # `.gdip` 의 `binary=` 가 목적지 이름이라, `haptics.release.a` /
          # `haptics.debug.a` 라는 이름으로는 여기서 아무것도 안 나온다.
          # 자리도 프로젝트 루트가 아니라 `<앱>/ios/plugins/<플러그인>/` 이다.
          LIB="$(find build/ios -path '*/ios/plugins/*' -name '*.a' -print -quit)"
          if [ -z "$LIB" ]; then
            echo "::error::익스포트된 Xcode 프로젝트에 플러그인 .a 가 없다 — .gdip 이 안 읽혔거나 preset 의 plugins/Haptics 가 꺼져 있다."
            find build/ios -name '*.a' -print
            exit 1
          fi
          echo "링크될 플러그인 = $LIB ($(wc -c < "$LIB") bytes)"
          # 그 .a 가 우리가 구운 것과 같은 물건인지까지 본다. 빈 껍데기가
          # 복사돼도 존재 검사만으로는 통과하기 때문이다.
          nm -gU "$LIB" 2>/dev/null | grep -q "register_haptics_types" || { echo "::error::익스포트된 .a 에 register_haptics_types 심볼이 없다."; exit 1; }
          # **파일 참조가 있다 != 링크된다.** pbxproj 는 `PBXFileReference` 와
          # `PBXBuildFile` 을 따로 두고, 실제로 링크되는 것은 후자가
          # `PBXFrameworksBuildPhase` 의 files 목록에 들어 있을 때뿐이다.
          # 그래서 UUID 를 두 번 타고 들어가 그 목록에서 확인한다 — "haptics"
          # 문자열이 파일 어딘가에 있다는 것만으로는 아무것도 보장되지 않는다.
          PBX="$(find build/ios -maxdepth 3 -name 'project.pbxproj' -print -quit)"
          REF="$(grep -oE "[0-9A-F]{24} = \{isa = PBXFileReference[^}]*haptics[^}]*\}" "$PBX" | grep -oE "^[0-9A-F]{24}" | head -1)"
          test -n "$REF" || { echo "::error::pbxproj 에 haptics PBXFileReference 가 없다."; exit 1; }
          BF="$(grep -oE "[0-9A-F]{24} = \{isa = PBXBuildFile; fileRef = $REF;" "$PBX" | grep -oE "^[0-9A-F]{24}" | head -1)"
          test -n "$BF" || { echo "::error::haptics 파일 참조는 있는데 PBXBuildFile 이 없다 — 링크 대상이 아니다."; exit 1; }
          awk '/Begin PBXFrameworksBuildPhase/,/End PBXFrameworksBuildPhase/' "$PBX" | grep -q "$BF" || { echo "::error::haptics 가 Frameworks 링크 단계에 없다."; exit 1; }
          echo "링크 단계 확인 — PBXFileReference $REF -> PBXBuildFile $BF -> Frameworks"

      - name: Xcode 프로젝트 / 스킴 찾기
        id: xc
        run: |
          set -euo pipefail
          PROJ="$(find build/ios -maxdepth 3 -name '*.xcodeproj' -print -quit)"
          if [ -z "$PROJ" ]; then
            echo "::error::.xcodeproj 를 찾지 못했다. Godot 익스포트가 실패했거나 결과물 위치가 바뀌었다."
            find build -maxdepth 4 -print
            exit 1
          fi
          SCHEME="$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{f=1;next} f && NF {print $1; exit}')"
          echo "proj=$PROJ"     >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"
          echo "프로젝트=$PROJ / 스킴=$SCHEME"

      - name: xcodebuild (서명 없이)
        run: |
          set -euo pipefail
          xcodebuild \
            -project "${{ steps.xc.outputs.proj }}" \
            -scheme "${{ steps.xc.outputs.scheme }}" \
            -configuration "${{ steps.cfg.outputs.xcode_config }}" \
            -sdk iphoneos \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: unsigned .ipa 로 포장
        id: pack
        run: |
          set -euo pipefail
          APP="$(find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -name '*.app' -type d -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::.app 이 없다 — xcodebuild 는 통과했는데 산출물이 없다."
            find "$RUNNER_TEMP/dd/Build/Products" -maxdepth 3 -print
            exit 1
          fi
          echo ".app = $APP"

          # 아이폰에서 타이틀 화면부터 죽는 사고를 여기서 잡는다. game.db 는
          # 리소스가 아니라 include_filter 로만 pck 에 들어가므로, 필터가
          # 조용히 빗나가면 빌드는 초록불인데 게임은 DB 오류로 멈춘다.
          PCK="$(find "$APP" -maxdepth 1 -name '*.pck' -print -quit)"
          if [ -n "$PCK" ] && ! grep -aq "data/game.db" "$PCK"; then
            echo "::error::pck 안에 data/game.db 가 없다 — export_presets.cfg 의 include_filter 를 확인할 것."
            exit 1
          fi
          echo "pck 안에서 data/game.db 확인됨"

          # 마지막 게이트 — 네이티브 햅틱이 **최종 바이너리 안에** 있는가.
          # 정적 아카이브의 멤버는 참조하는 심볼이 있을 때만 끌려 들어오므로,
          # 링크 단계에 .a 가 있어도 Godot 이 만든 초기화 코드가 빠지면 통째로
          # 버려질 수 있다. 그 경우가 정확히 "빌드 초록불 + 폰에서는 폴백" 이다.
          #
          # **`nm` 은 쓰지 않는다** — 103MB 짜리 이 바이너리에서 두 심볼을 다
          # 놓쳤다(실측). 이름은 문자열 테이블에 그대로 들어 있으므로 바이트를
          # 직접 훑는 쪽이 확실하다.
          BIN="$APP/$(basename "$APP" .app)"
          test -f "$BIN" || { echo "::error::.app 안에 실행 바이너리가 없다: $BIN"; exit 1; }
          echo "app 바이너리: $(file -b "$BIN")"
          LC_ALL=C grep -qa "register_haptics_types" "$BIN" || { echo "::error::최종 바이너리에 register_haptics_types 가 없다 — 플러그인이 링크 단계에는 있었지만 데드 스트립됐다. 이대로면 폰에서 Input.vibrate_handheld 폴백이 돈다."; exit 1; }
          # ObjC 클래스 참조는 dyld 가 런타임에 묶는 외부 심볼이라 스트립을
          # 견딘다. 이 빌드에서 그 UIKit 클래스를 부르는 코드는 플러그인뿐이다.
          LC_ALL=C grep -qa 'OBJC_CLASS_$_UIImpactFeedbackGenerator' "$BIN" || { echo "::error::최종 바이너리에 UIImpactFeedbackGenerator 참조가 없다 — 햅틱 구현이 안 들어갔다."; exit 1; }
          HAP_NOTE="네이티브 (Taptic Engine) — 최종 바이너리에서 확인됨"
          echo "HAPTICS: $HAP_NOTE"

          rm -rf "$RUNNER_TEMP/Payload"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          IPA="$RUNNER_TEMP/${APP_NAME}-${{ steps.cfg.outputs.build_type }}-unsigned.ipa"
          ( cd "$RUNNER_TEMP" && zip -qry "$IPA" Payload )
          ls -lh "$IPA"
          echo "ipa=$IPA" >> "$GITHUB_OUTPUT"
          {
            echo "### iOS 테스트 빌드 완료"
            echo ""
            echo "- 타입: ${{ steps.cfg.outputs.build_type }}"
            echo "- 번들 ID: com.toniqat.esportsmanager"
            echo "- 크기: $(du -h "$IPA" | cut -f1)"
            echo "- 햅틱: $HAP_NOTE"
            echo ""
            echo "아래 아티팩트를 내려받아 압축을 푼 뒤, 나온 .ipa 를 Sideloadly 에 넣으면 된다."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-ios-${{ steps.cfg.outputs.build_type }}-unsigned-ipa
          path: ${{ steps.pack.outputs.ipa }}
          if-no-files-found: error
          retention-days: 30
